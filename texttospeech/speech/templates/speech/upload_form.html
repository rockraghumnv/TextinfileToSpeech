<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convert File-to-Audio</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1e90ff, #ff69b4);
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        h1 {
            color: #ffeb3b;
            text-align: center;
            font-size: 3rem;
            margin-top: 3rem;
        }

        .form-container {
            width: 400px;
            background-color: rgba(255, 255, 255, 0.9);
            padding: 30px;
            border: 2px solid #4caf50;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            border-radius: 10px;
            margin-top: 20px;
        }

        .form-container input[type="file"],
        .form-container input[type="email"],
        .form-container input[type="submit"] {
            width: calc(100% - 20px);
            font-size: 1.6rem;
            padding: 1rem;
            margin-bottom: 1rem;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }

        .form-container #submit {
            background-color: #4caf50;
            color: white;
            cursor: pointer;
        }

        .form-container #submit:hover {
            background-color: #45a049;
        }

        #pleaseWaitMessage {
            text-align: center;
            display: none;
            margin-top: 20px;
            color: #333;
        }

        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #4caf50;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <h1>Convert File-to-Audio</h1>
    <div class="form-container">
        <form action="{% url 'speech:index' %}" method="post" enctype="multipart/form-data" onsubmit="showPleaseWait()">
            {% csrf_token %}
            <input type="file" name="file" placeholder="Upload File" />
            <input type="email" name="email" placeholder="Your Email" />
            <input type="submit" id="submit" value="Convert" />
        </form>
        <div id="pleaseWaitMessage">
            <div class="loader"></div>
            <p><strong>Please wait!</strong> Your audio file is being processed...</p>
        </div>
    </div>

    <script>
        function showPleaseWait() {
            document.getElementById('pleaseWaitMessage').style.display = 'block';
        }
    </script>
</body>
</html>
